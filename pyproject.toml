[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlctube"
version = "3.1.0"
description = "Modern desktop launcher that resolves online video streams with yt-dlp and plays them in VLC."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Swir"}]
keywords = ["vlc", "yt-dlp", "youtube", "stream", "desktop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "yt-dlp>=2026.8.19,<2027",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]
build = ["Pillow>=11,<12", "pyinstaller>=6.22,<7"]

[project.scripts]
vlctube = "vlctube.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
